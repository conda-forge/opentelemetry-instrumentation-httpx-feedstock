{% set name = "opentelemetry-instrumentation-httpx" %}
{% set version = "0.64b0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_')}}-{{ version }}.tar.gz
  sha256: c2cfcd03d3665762860ebd0c28038c6e47fbb48d7942dec31dd75fc634d25c92

build:
  skip: true # [py<310]
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python
    - pip
    - hatchling
  run:
    - python
    - opentelemetry-api >=1.12
    - opentelemetry-instrumentation {{ version }}
    - opentelemetry-semantic-conventions {{ version }}
    - opentelemetry-util-http {{ version }}
    - wrapt >=1.0.0,<3.0.0

# Unable to run tests, respx is not available in the main channel.
test:
  imports:
    - opentelemetry
    - opentelemetry.instrumentation
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/open-telemetry/opentelemetry-python-contrib/tree/main/instrumentation/opentelemetry-instrumentation-httpx
  summary: OpenTelemetry HTTPX Instrumentation
  description: |
    This library allows tracing HTTP requests made by the httpx library.
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  dev_url: https://github.com/open-telemetry/opentelemetry-python-contrib/tree/main/instrumentation/opentelemetry-instrumentation-httpx
  doc_url: https://github.com/open-telemetry/opentelemetry-python-contrib/blob/v0.64b0/instrumentation/opentelemetry-instrumentation-httpx/README.rst

extra:
  recipe-maintainers:
    - mariusvniekerk
